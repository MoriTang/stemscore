[package]
name = "stemscore-desktop"
version = "0.1.0"
description = "Real-time system audio recording and stem separation for StemScore"
authors = ["StemScore contributors"]
edition = "2021"

[lib]
name = "stemscore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
cpal = "0.18.2"
directories = "6.0"
hound = "3.5.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-27"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
ringbuf = "0.5.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
symphonia = { version = "0.5.5", features = ["all"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
